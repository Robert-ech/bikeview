name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configure public Mapbox token
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const token = process.env.MAPBOX_ACCESS_TOKEN;
            if (!token?.startsWith("pk.")) {
              console.error("Set the MAPBOX_ACCESS_TOKEN repository secret to a Mapbox public token.");
              process.exit(1);
            }
            writeFileSync(
              "map-config.js",
              `export const MAPBOX_ACCESS_TOKEN = ${JSON.stringify(token)};\n`,
            );
          '
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
